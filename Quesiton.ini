# B. SOP（你交给 GLM-5 的“操作流程”）

## SOP-0：仓库结构（固定下来，后面全自动）
建议你把实验工程做成一个 repo（OpenCode 在里面跑）：

```
geo-bench/
  data/
    problems.jsonl
  configs/
    sweep.yaml
  wl/
    scene_builders.wl
    bench_core.wl
  scripts/
    bench.py
    render.py
    report.py
    analyze.py
  app/
    rate_streamlit.py
  outputs/
    run_YYYYMMDD_HHMM/
      results.jsonl
      images/
      report.md
      report.html
      ratings.csv
      analysis.md
      figures/
```

## SOP-1：题目获取（你只需要告诉它“从哪来”）
你只要约定一种输入格式即可，例如 `data/problems.jsonl` 每行：

```json
{"id":"p0001","text":"(可选)题干原文","dsl":{...},"meta":{"source":"..."}}
```

> 你的 DSL 已经有了的话，实验阶段**优先用 DSL**，题干文本只当展示字段。

## SOP-2：约束扫参配置（你要试什么，就写进 YAML）
`configs/sweep.yaml`（示意）：

```yaml
timeout_s: 60
instances_per_problem: 1
random_seeds: [1,2,3]     # 用于复现实验（RandomSeeding）
render_images: true       # 你需要人工打分就开
constraint_recipes:
  - name: baseline_layout
    layout:
      triangle_base_horizontal: true
    shape: []

  - name: angle_min_15
    layout:
      triangle_base_horizontal: true
    shape:
      - type: interior_angle_min
        vertex: "B"
        min_deg: 15

  - name: r_over_R_ge_0p10
    layout:
      triangle_base_horizontal: true
    shape:
      - type: inradius_over_circumradius_min
        min_ratio: 0.10
```

这里的 **layout** 会用 `GeometricAssertion`（例如 Horizontal/Rightward/Counterclockwise/Distinct）；**shape** 会用 `TriangleMeasurement`（例如 Inradius/Circumradius/InteriorAngle）。   

## SOP-3：求解与计时（核心脚本：不渲染也能跑，渲染只对成功样本）
你要 GLM-5 写一个 runner，核心逻辑是：

1) 从 DSL 生成 `GeometricScene`（包含题设 hypotheses + layout hypotheses + shape hypotheses；并设置 `UnconstrainedParameters`）。   
2) `TimeConstrained[RandomInstance[scene], timeout, $Failed]` 做门槛；并记录耗时、成功/失败、失败类型（超时/无解/返回非 `GeometricScene`）。   
3) 成功后：
   - 取 `inst["Parameters"]` 存档（不需要渲染也能存）。   
   - **可选**取 `inst["AlgebraicFormulation"]` 做“复杂度 proxy”（叶子数/字符串长度等），因为 Wolfram 明确说几何会转成代数约束；你也能直接取该属性。   
4) 只有当你要人工打分时，才取 `inst["Graphics"]` 并 `Export` 成 PNG（图像越大越慢，所以统一 `ImageSize`）。   

> 这里非常关键：你抱怨“生成图慢”，那就把**渲染变成后置步骤**：先跑完求解/计时，最后只对成功的（或你抽样的）导出图用于人工打分。

## SOP-4：报告生成（MD + HTML 两份都出）
- `report.md`：适合 VSCode / GitHub / Obsidian 看图+表格  
- `report.html`：适合浏览器一键打开、滚动打分（通常比 MD 渲染一致）

报告内容建议固定成表格列：
- problem_id
- recipe_name
- seed
- success
- solve_time_s
- （可选）algebraic_complexity
- image（缩略图）
- link（点开大图）

## SOP-5：人工打分 GUI（你回来只做 1-5）
用 Streamlit/Gradio 这类都可以。最省心的是 Streamlit：一张图 + 元信息 + 1~5 单选 + Next。  
输出 `ratings.csv`：

```csv
problem_id,recipe_name,seed,rating,comment
p0001,r_over_R_ge_0p10,1,4,"..."
```

## SOP-6：分析（把“时间 vs 质量”讲清楚）
GLM-5 再跑 `analyze.py` 合并 `results.jsonl + ratings.csv`，输出：

- 每个 recipe 的：
  - 成功率（%）
  - 中位数求解时间（p50/p90）
  - 平均人工评分
- 评分 vs 求解时间散点图
- 评分 vs 各无量纲约束强度（比如 min_ratio）趋势图
- “最划算的 recipe”（单位时间带来评分提升最大）

