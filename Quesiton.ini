# 整体架构：一个 Prime Agent + 三个阶段性 Subagent + 五个 Skill

```
┌─────────────────────────────────────────────────────────────┐
│                    Prime Agent (你自己)                       │
│         职责：下达实验指令、人工打分、做最终决策                  │
└──────────────┬──────────────────────────────────┬───────────┘
               │                                  │
    ┌──────────▼──────────┐           ┌───────────▼───────────┐
    │  Phase 1: 实验阶段    │           │  Phase 3: 分析阶段     │
    │  Subagent: Experimenter│          │  Subagent: Analyst    │
    └──────────┬──────────┘           └───────────────────────┘
               │
    ┌──────────▼──────────┐
    │  Phase 2: 打分阶段    │
    │  Subagent: Scorer    │
    │  (GUI, 你来操作)      │
    └─────────────────────┘
```

