# C. 在 OpenCode 里：你应该定义哪些 prime agent / subagents / skills？

OpenCode 本身就区分 **primary agents** 和 **subagents**，并且 primary 可以通过 Task 工具调用 subagents；权限（bash/edit/write 等）也可以按 agent 配置。   

OpenCode 还支持 **skills**（仓库里放 `.opencode/skills/<name>/SKILL.md`，按需由 `skill` 工具加载）。   

另外，强烈建议你做 2~3 个 **custom tools**（放 `.opencode/tools/`），把“跑 bench / 出 report / 启动打分 GUI”封装成标准工具调用；OpenCode 的自定义工具就是干这个的，且工具定义用 JS/TS，但内部可以调用任意语言脚本。   

---

## 1) Prime agent（1 个 primary 就够）：`geo-orchestrator`
职责：你唯一对话入口。你只需要告诉它三件事：
- 题目来源（文件路径/接口）
- sweep 配置（用哪个 YAML）
- 是否需要导出图+开启打分

权限建议：
- `bash: allow`（要跑脚本）
- `edit/write: ask`（避免它乱改你数据集/配置）
- `task: allow`（允许它叫 subagent 干活）

（primary/subagent 的概念与配置方式见 OpenCode agents 文档。 ）

## 2) Subagents（建议 4 个，分工明确）
### a) `wl-constraint-designer`（子代理：Wolfram 约束专家）
- 输入：你要加什么无量纲约束/布局约束
- 输出：对应的 WL hypotheses 片段（用 `GeometricAssertion`/`TriangleMeasurement`），以及“是否可能变慢”的风险提示  
依据：`GeometricAssertion` 支持布局谓词；`TriangleMeasurement` 支持内外接半径、角度、高度等。   

权限：不需要 bash；只需 read。

### b) `bench-runner`（子代理：跑实验）
- 负责：写/改脚本、运行 sweep、落盘 results、导出图  
会大量用 bash、write。

求解端关键机制：`RandomInstance` 对 `GeometricScene` 返回 `GeometricScene`，且默认做一般位置/非退化假设；配合 `TimeConstrained` 做 timeout。   

### c) `report-writer`（子代理：报告生成）
- 把结果做成 `report.md` + `report.html`
- 统一图像路径与表格样式

### d) `data-analyst`（子代理：统计分析）
- 读取 ratings.csv + results.jsonl
- 输出 analysis.md + 图表

---

## 3) Skills（建议 5 个 SKILL.md，把 SOP 写成“可复用手册”）
OpenCode skills 的放置与发现机制是标准化的：`.opencode/skills/<name>/SKILL.md`。   

我建议你建这 5 个技能（名字可按你喜好改，但尽量保持“可检索”）：

1) `wl-benchmark-runbook`  
   - 规定：如何构建 `GeometricScene`，如何设置 `UnconstrainedParameters`，如何加 layout/shape hypotheses  
   - 规定：如何用 `TimeConstrained` 和 `RandomSeeding` 做可重复 benchmark   

2) `dimensionless-constraints-library`  
   - 约束模板库：  
     - 角度下限：`TriangleMeasurement[..., {"InteriorAngle",p}] > ...`   
     - \(r/R\)：`TriangleMeasurement[..., "Inradius"]/TriangleMeasurement[..., "Circumradius"] > eps`   
     - 布局：`GeometricAssertion[Line[{A,C}], "Horizontal"]` 等   

3) `reporting-standard`  
   - 规定 report.md/html 的字段、排序、图片大小、命名规范

4) `human-rating-loop`  
   - 规定：Streamlit 页面怎么展示、评分 CSV 格式、如何断点续评

5) `analysis-standard`  
   - 规定：输出哪些统计指标（成功率、p50/p90 时间、均值评分、相关性/显著性等）

---

## 4) Custom tools（建议 3 个，一下子把“让 GLM-5 干活”变得非常稳）
用 OpenCode 的 custom tools，把动作封装起来（工具放 `.opencode/tools/`）。   

建议工具：

1) `run_sweep(config_path)`  
   - bash 跑：`python scripts/bench.py --config configs/sweep.yaml --out outputs/run_xxx`

2) `build_report(run_dir)`  
   - 产出：report.md + report.html

3) `launch_rater(run_dir)`  
   - bash 跑：`streamlit run app/rate_streamlit.py -- --run_dir outputs/run_xxx`

这样你的 prime agent（geo-orchestrator）就不需要每次“现写命令”，只要工具调用即可，可靠性会高很多。

