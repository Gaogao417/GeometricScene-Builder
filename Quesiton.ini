## Skill 定义（GLM-5 需要掌握的五个能力模块）

### Skill 1: `ProblemCollector`
**职责**：获取/生成待测试的几何题，并标准化为统一格式

```yaml
Skill: ProblemCollector
输入: 题目来源指令（你告诉它从哪获取）
输出: problems.json

输出格式:
  - problem_id: "P001"
    source: "手写" | "教材" | "API生成"
    text: "在△ABC中，AB=AC=5，BC=6，D是BC中点，求AD"
    known_angles: [null]           # 题目已知角（用于判断角度约束是否冲突）
    known_lengths: ["AB=5","AC=5","BC=6"]
    special_properties: ["isosceles"]  # 等腰/等边/直角等
    points: ["A","B","C","D"]
    constructed_points:            # 由构造确定的点
      D: "Midpoint[{B,C}]"
    free_points: ["A","B","C"]     # 候选自由点
    base_edge: ["B","C"]           # 建议底边
    expected_difficulty: "easy"    # 预估求解难度
```

**你只需要告诉 GLM-5**：
> "从以下 10 道题生成 problems.json：[贴题目]"
> 或："帮我生成 20 道覆盖三角形/四边形/圆的几何题，难度从易到难"

---

### Skill 2: `ConstraintDesigner`
**职责**：根据你的指令，为每道题生成多组约束配置（实验的自变量）

```yaml
Skill: ConstraintDesigner
输入: problems.json + 你指定的约束组合策略
输出: experiment_configs.json

约束层级定义:
  L0_base:        # 纯题设，必选
    - "题目原始几何条件"

  L1_orientation: # 朝向/方向，几乎零代价
    - GeometricAssertion "Horizontal"
    - GeometricAssertion "Rightward"
    - GeometricAssertion "Counterclockwise"
    - GeometricAssertion "Distinct"
    - Last[top] > 0

  L2_angle:       # 角度下界，中等代价
    variants:
      - "all_angles > 5 Degree"
      - "all_angles > 10 Degree"
      - "all_angles > 15 Degree"
      - "non_given_angles > 10 Degree"  # 只约束非题设角

  L3_ratio:       # 无量纲比例，高代价
    variants:
      - "Inradius/Circumradius > 0.05"
      - "Inradius/Circumradius > 0.10"
      - "Inradius/Circumradius > 0.15"
      - "Height/Perimeter > 0.05"
      - "Height/Perimeter > 0.08"

实验矩阵（每道题 × 每种配置 = 一个算例）:
  - config_id: "C01"
    layers: [L0]
    label: "纯题设，无任何额外约束"

  - config_id: "C02"
    layers: [L0, L1]
    label: "题设 + 朝向"

  - config_id: "C03"
    layers: [L0, L1, L2_angle_5]
    label: "题设 + 朝向 + 角度>5°"

  - config_id: "C04"
    layers: [L0, L1, L2_angle_10]
    label: "题设 + 朝向 + 角度>10°"

  - config_id: "C05"
    layers: [L0, L1, L2_angle_15]
    label: "题设 + 朝向 + 角度>15°"

  - config_id: "C06"
    layers: [L0, L1, L2_angle_10, L3_rR_005]
    label: "题设 + 朝向 + 角度>10° + r/R>0.05"

  - config_id: "C07"
    layers: [L0, L1, L2_angle_10, L3_rR_010]
    label: "题设 + 朝向 + 角度>10° + r/R>0.10"

  # ... 你可以随时让 GLM-5 加新组合
```

**你只需要告诉 GLM-5**：
> "用这 7 种约束配置，和 problems.json 里的 20 道题做交叉，生成 experiment_configs.json"
> 或："我想额外测试 L3 里加个面积约束，帮我加到配置矩阵里"

---

### Skill 3: `ExperimentRunner`
**职责**：生成并执行实验脚本，收集每个算例的定量指标 + 图像

这是最核心的 Skill。GLM-5 需要帮你写一个 Python 脚本，调用 `wolframclient` 执行每个算例。

```yaml
Skill: ExperimentRunner
输入: experiment_configs.json
输出: results/ 目录
  ├── results.json          # 所有算例的定量指标
  ├── images/               # 每个算例的渲染图
  │   ├── P001_C01.png
  │   ├── P001_C02.png
  │   └── ...
  └── errors.log            # 失败算例的错误信息
```

**GLM-5 需要帮你写的核心脚本** `run_experiment.py`：

```python
"""
实验运行器：批量测试不同约束配置对 GeometricScene 生成质量的影响
用法：python run_experiment.py --config experiment_configs.json --timeout 60
"""
import json, time, os, sys
from pathlib import Path
from wolframclient.evaluation import WolframLanguageSession
from wolframclient.language import wlexpr, wl

# ============ 初始化 ============
session = WolframLanguageSession()
TIMEOUT = 60  # 你说的60s
RESULTS_DIR = Path("results")
IMAGES_DIR = RESULTS_DIR / "images"
IMAGES_DIR.mkdir(parents=True, exist_ok=True)

# ============ 约束层构建函数 ============
def build_L1_orientation(base1, base2, top):
    """Layer 1: 朝向约束（线性，几乎零代价）"""
    return f'''
        GeometricAssertion[Line[{{{base1}, {base2}}}], "Horizontal"],
        GeometricAssertion[Line[{{{base1}, {base2}}}], "Rightward"],
        GeometricAssertion[{{{base1}, {base2}, {top}}}, "Counterclockwise"],
        GeometricAssertion[{{{base1}, {base2}, {top}}}, "Distinct"],
        Last[{top}] > 0
    '''

def build_L2_angle(points_triplets, min_angle_deg, exclude_angles=None):
    """Layer 2: 角度下界（中等代价）
    points_triplets: [("c","a","b"), ("a","b","c"), ("b","c","a")]
    exclude_angles: 题目已给角度的顶点，不重复约束
    """
    exclude = set(exclude_angles or [])
    constraints = []
    for p1, vertex, p2 in points_triplets:
        if vertex not in exclude:
            constraints.append(
                f'PlanarAngle[{{{p1}, {vertex}, {p2}}}] > {min_angle_deg} Degree'
            )
    return ",\n        ".join(constraints)

def build_L3_inradius_circumradius(points, min_ratio):
    """Layer 3: 内切圆/外接圆半径比（高代价，嵌套根式）"""
    pts = ", ".join(points)
    return f'''
        TriangleMeasurement[{{{pts}}}, "Inradius"] >
          {min_ratio} * TriangleMeasurement[{{{pts}}}, "Circumradius"]
    '''

def build_L3_height_perimeter(points, vertex, min_ratio):
    """Layer 3: 高度/周长比（高代价）"""
    pts = ", ".join(points)
    return f'''
        TriangleMeasurement[{{{pts}}}, {{"Height", {vertex}}}] >
          {min_ratio} * TriangleMeasurement[{{{pts}}}, "Perimeter"]
    '''

# ============ 单个算例执行 ============
def run_single_case(problem, config, timeout=TIMEOUT):
    """
    执行单个算例，返回结果字典
    """
    result = {
        "problem_id": problem["problem_id"],
        "config_id": config["config_id"],
        "config_label": config["label"],
        "success": False,
        "time_seconds": None,
        "error": None,
        "image_path": None,
        "num_constraints": None,
    }

    # 1) 组装 GeometricScene 代码
    scene_code = assemble_scene(problem, config)
    result["num_constraints"] = scene_code.count(",") + 1  # 粗略统计

    # 2) 执行 RandomInstance + 计时
    start = time.time()
    try:
        # 先求实例（不渲染）
        wl_code = f'''
            TimeConstrained[
                Module[{{scene, ri}},
                    scene = {scene_code};
                    ri = RandomInstance[scene];
                    If[Head[ri] === GeometricScene,
                        <|"status" -> "OK",
                          "points" -> Length[ri["Points"]]|>,
                        <|"status" -> "Failed",
                          "detail" -> ToString[Head[ri]]|>
                    ]
                ],
                {timeout},
                <|"status" -> "Timeout"|>
            ]
        '''
        eval_result = session.evaluate(wlexpr(wl_code))
        elapsed = time.time() - start
        result["time_seconds"] = round(elapsed, 2)

        status = str(dict(eval_result).get("status", "Unknown"))

        if status == "OK":
            result["success"] = True
            # 3) 成功了才渲染图（单独计时，不算在求解时间内）
            img_filename = f"{problem['problem_id']}_{config['config_id']}.png"
            img_path = str(IMAGES_DIR / img_filename)
            try:
                session.evaluate(wlexpr(f'''
                    Export["{img_path}",
                        RandomInstance[{scene_code}],
                        ImageSize -> 400
                    ]
                '''))
                result["image_path"] = img_path
            except Exception as e:
                result["error"] = f"渲染失败: {e}"
                # 求解成功但渲染失败，仍算 success
        else:
            result["error"] = status

    except Exception as e:
        elapsed = time.time() - start
        result["time_seconds"] = round(elapsed, 2)
        result["error"] = str(e)

    return result

# ============ 场景组装（核心逻辑）============
def assemble_scene(problem, config):
    """根据 problem + config 组装完整的 GeometricScene 代码"""
    points = problem["points"]
    points_str = ", ".join(points)

    # 题设约束 (L0)
    hypotheses = list(problem.get("base_hypotheses_wl", []))

    # 根据 config 的 layers 依次追加
    layers = config.get("layers", [])

    if "L1" in layers:
        base = problem["base_edge"]
        # 选一个非底边点作为 top
        top = next(p for p in problem["points"] if p not in base)
        hypotheses.append(build_L1_orientation(base[0], base[1], top))

    for layer in layers:
        if layer.startswith("L2_angle_"):
            min_deg = int(layer.split("_")[-1])
            triplets = get_angle_triplets(points)
            exclude = [a["vertex"]
                       for a in problem.get("known_angles", []) if a.get("vertex")]
            constraint = build_L2_angle(triplets, min_deg, exclude)
            if constraint:
                hypotheses.append(constraint)

        elif layer.startswith("L3_rR_"):
            ratio = int(layer.split("_")[-1]) / 100  # "010" -> 0.10
            tri_points = problem["points"][:3]
            hypotheses.append(
                build_L3_inradius_circumradius(tri_points, ratio))

        elif layer.startswith("L3_hP_"):
            ratio = int(layer.split("_")[-1]) / 100
            tri_points = problem["points"][:3]
            top = next(p for p in problem["points"] if p not in problem["base_edge"])
            hypotheses.append(
                build_L3_height_perimeter(tri_points, top, ratio))

    # 组装
    hyps_str = ",\n    ".join(hypotheses)
    return f"GeometricScene[{{{points_str}}}, {{\n    {hyps_str}\n}}]"

def get_angle_triplets(points):
    """生成所有三点角组合"""
    from itertools import permutations
    return [(a, b, c) for a, b, c in permutations(points, 3)
            if a < c]  # 去重

# ============ 批量执行 ============
def run_all(config_path, timeout=TIMEOUT):
    with open(config_path) as f:
        experiment = json.load(f)

    problems = experiment["problems"]
    configs = experiment["configs"]
    all_results = []

    total = len(problems) * len(configs)
    print(f"共 {len(problems)} 题 × {len(configs)} 配置 = {total} 个算例")
    print(f"最坏情况耗时：{total * timeout / 60:.0f} 分钟\n")

    for i, problem in enumerate(problems):
        for j, config in enumerate(configs):
            idx = i * len(configs) + j + 1
            print(f"[{idx}/{total}] {problem['problem_id']} × "
                  f"{config['config_id']} ({config['label']})")

            result = run_single_case(problem, config, timeout)

            status = "✅" if result["success"] else "❌"
            t = result["time_seconds"] or "N/A"
            print(f"  {status} {t}s | {result.get('error', '')}\n")

            all_results.append(result)

    # 保存结果
    output_path = RESULTS_DIR / "results.json"
    with open(output_path, "w", encoding="utf-8") as f:
        json.dump(all_results, f, ensure_ascii=False, indent=2)
    print(f"\n结果已保存到 {output_path}")
    return all_results

if __name__ == "__main__":
    import argparse
    parser = argparse.ArgumentParser()
    parser.add_argument("--config", default="experiment_configs.json")
    parser.add_argument("--timeout", type=int, default=60)
    args = parser.parse_args()
    TIMEOUT = args.timeout
    run_all(args.config, args.timeout)
```

