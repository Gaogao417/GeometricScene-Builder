# 为什么用 HTML 而不是 Markdown？

| | Markdown | HTML (plotly) |
|---|---|---|
| 图表交互 | ❌ 静态图片 | ✅ 鼠标悬停看数值、缩放、筛选 |
| 图片嵌入 | 能嵌但排版差 | 灵活排版 |
| 数据联动 | ❌ | ✅ 点击某个配置高亮所有相关数据 |
| 生成难度 | 低 | plotly 也很简单 |
| 分享 | 直接看 | 直接浏览器打开 |

**结论：分析报告用 plotly 输出 HTML，打分用 tkinter GUI，原始数据用 JSON。**

