Q: 所以现在最着急的不是规划如何训练模型，而是如何让glm-5在opencode里帮我验证上面提到的这些方案：主要是我来指示它针对各种问题，加不同类型、数目的无量纲参数，试验输出的速度和效果。内外径比那些参数我觉得可以用来验证。

我需要一个sop，到时候我只要告诉它从哪获取题目，加哪些无量纲参数，glm-5帮我写个脚本跑并验证每个算例的关键指标和实际输出图像。然后再做必要的整理和分析，比如把指标和图像放在一个md里面（我不确定md渲染效果好还是用别的方式）。这样我就能了解无量纲参数对时间和效果的影响了，我也能弄清哪些指标对题目的生成质量更占主导影响。

哎，其实可以这样，题目生成完以后，放进一个打分的gui里，自动播放每张图，让我1-5打分。整个工作流就是：我先给必要的信息，让glm-5帮我干活，等干完活我回来给每张图人工打分。打完分我再让glm-5再根据我打的分数做数据分析

所以我需要定义哪些prime agent/subagent/skills？

A1：
你现在要的不是“再想一套训练法”，而是先把**实验/验证流水线**做成可重复的 SOP：给 GLM-5 一份“工作手册”，它就能在 OpenCode 里自动写脚本、跑 Wolfram Engine、出图、汇总、生成打分界面、再做统计分析。

下面我给你一个**可直接落地的 SOP**，以及在 OpenCode 里应该定义的 **prime agent / subagents / skills / custom tools**（按你描述的“我给必要信息→它跑完→我回来打分→它分析”的模式来设计）。

---

# A. 目标：你要验证什么（实验定义）

你要验证“无量纲质量约束（比如 \(r/R\)、角度下限等）对**求解时间**和**图形观感**的影响”。

Wolfram 这边相关能力（用于你实验）：

- `GeometricScene`：hypotheses 里可以放对象、等式/不等式、`GeometricAssertion`、`TriangleMeasurement` 等；`RandomInstance` 会为点/标量填具体值满足 hypotheses；场景可取 `"Graphics"`、`"Parameters"`、`"AlgebraicFormulation"` 等属性；还支持 `UnconstrainedParameters` 作为选项。   
- `RandomInstance`：当输入是 `GeometricScene` 时会返回 `GeometricScene`（或列表），并默认做“一般位置/非退化”等假设；可用 `RandomSeeding` 固定随机性。   
- `GeometricAssertion`：可以直接写“Horizontal/Vertical/Rightward/Counterclockwise/Distinct”等布局断言（对线/点/多边形均有谓词/关系），并可用于 `GeometricScene` hypotheses。   
- `TriangleMeasurement`：明确支持 `"Inradius"`, `"Circumradius"`, `{"InteriorAngle",p}`, `{"Height",p}` 等，并且**可以与 `GeometricScene` 的符号点一起使用**（这就是你要的无量纲约束来源之一）。   
- `TimeConstrained[expr,t,failexpr]`：超时返回你给的 `failexpr`（非常适合你做 60s 门槛）。   

