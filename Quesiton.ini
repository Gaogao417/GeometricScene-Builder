### Skill 4: `ScoringGUI`
**职责**：生成一个打分 GUI，让你快速给每张图 1-5 分

```yaml
Skill: ScoringGUI
输入: results.json + images/
输出: scores.json（你的人工评分）

交互方式:
  - 自动播放每张图（只显示成功的算例）
  - 显示题目文本 + 约束配置标签
  - 你打 1-5 分（键盘快捷键 1-5，按一下自动跳下一张）
  - 支持回退修改
  - 实时显示进度
  - 结束后自动保存 scores.json
```

**GLM-5 需要帮你写的打分工具** `scorer_gui.py`：

```python
"""
几何图形质量打分工具
用法: python scorer_gui.py --results results/results.json
快捷键: 1-5 打分并跳下一张, ← 回退, q 保存退出
"""
import json, sys
from pathlib import Path
import tkinter as tk
from tkinter import ttk
from PIL import Image, ImageTk

class ScorerGUI:
    def __init__(self, results_path):
        # 加载数据
        with open(results_path) as f:
            all_results = json.load(f)

        # 只保留成功且有图的算例
        self.cases = [r for r in all_results
                      if r["success"] and r.get("image_path")]
        self.scores = {}
        self.current_idx = 0

        # 尝试加载已有打分（支持中断续打）
        self.scores_path = Path(results_path).parent / "scores.json"
        if self.scores_path.exists():
            with open(self.scores_path) as f:
                self.scores = json.load(f)
            # 跳到第一个未打分的
            for i, c in enumerate(self.cases):
                key = f"{c['problem_id']}_{c['config_id']}"
                if key not in self.scores:
                    self.current_idx = i
                    break

        # 构建 GUI
        self.root = tk.Tk()
        self.root.title("GeometricScene 图形质量打分")
        self.root.geometry("800x900")

        # 信息区
        self.info_frame = ttk.Frame(self.root)
        self.info_frame.pack(fill="x", padx=10, pady=5)

        self.progress_label = ttk.Label(self.info_frame, font=("", 14))
        self.progress_label.pack()

        self.problem_label = ttk.Label(self.info_frame,
                                        font=("", 11), wraplength=750)
        self.problem_label.pack(pady=5)

        self.config_label = ttk.Label(self.info_frame,
                                       font=("", 11), foreground="blue")
        self.config_label.pack()

        self.time_label = ttk.Label(self.info_frame,
                                     font=("", 10), foreground="gray")
        self.time_label.pack()

        # 图片区
        self.image_label = ttk.Label(self.root)
        self.image_label.pack(pady=10)

        # 打分区
        self.score_frame = ttk.Frame(self.root)
        self.score_frame.pack(pady=10)

        ttk.Label(self.score_frame,
                  text="打分: 1=很差  2=差  3=一般  4=好  5=很好",
                  font=("", 12)).pack()

        btn_frame = ttk.Frame(self.score_frame)
        btn_frame.pack(pady=5)
        for score in range(1, 6):
            btn = ttk.Button(btn_frame, text=str(score), width=6,
                           command=lambda s=score: self.give_score(s))
            btn.pack(side="left", padx=5)

        # 键盘绑定
        self.root.bind("1", lambda e: self.give_score(1))
        self.root.bind("2", lambda e: self.give_score(2))
        self.root.bind("3", lambda e: self.give_score(3))
        self.root.bind("4", lambda e: self.give_score(4))
        self.root.bind("5", lambda e: self.give_score(5))
        self.root.bind("<Left>", lambda e: self.go_prev())
        self.root.bind("q", lambda e: self.save_and_quit())

        self.show_current()
        self.root.mainloop()

    def show_current(self):
        if self.current_idx >= len(self.cases):
            self.finish()
            return

        case = self.cases[self.current_idx]
        key = f"{case['problem_id']}_{case['config_id']}"
        existing = self.scores.get(key, "未打分")

        self.progress_label.config(
            text=f"[{self.current_idx+1}/{len(self.cases)}]  "
                 f"已打分: {len(self.scores)}/{len(self.cases)}  "
                 f"当前分: {existing}")

        self.problem_label.config(
            text=f"题目 {case['problem_id']}: "
                 f"{case.get('problem_text', '(无题干)')}")

        self.config_label.config(
            text=f"约束配置: {case['config_label']}")

        self.time_label.config(
            text=f"求解耗时: {case['time_seconds']}s  "
                 f"约束数: {case.get('num_constraints', '?')}")

        # 加载图片
        img_path = case["image_path"]
        if Path(img_path).exists():
            img = Image.open(img_path)
            img = img.resize((600, 500), Image.LANCZOS)
            self.photo = ImageTk.PhotoImage(img)
            self.image_label.config(image=self.photo)
        else:
            self.image_label.config(image="", text="图片不存在")

    def give_score(self, score):
        case = self.cases[self.current_idx]
        key = f"{case['problem_id']}_{case['config_id']}"
        self.scores[key] = {
            "score": score,
            "problem_id": case["problem_id"],
            "config_id": case["config_id"],
            "config_label": case["config_label"],
            "time_seconds": case["time_seconds"],
        }
        self.current_idx += 1
        # 每 10 张自动保存一次
        if len(self.scores) % 10 == 0:
            self.auto_save()
        self.show_current()

    def go_prev(self):
        if self.current_idx > 0:
            self.current_idx -= 1
            self.show_current()

    def auto_save(self):
        with open(self.scores_path, "w", encoding="utf-8") as f:
            json.dump(self.scores, f, ensure_ascii=False, indent=2)

    def save_and_quit(self):
        self.auto_save()
        print(f"已保存 {len(self.scores)} 条评分到 {self.scores_path}")
        self.root.quit()

    def finish(self):
        self.auto_save()
        self.progress_label.config(text="全部打分完成！")
        self.image_label.config(image="", text="🎉 已完成")
        print(f"全部完成！共 {len(self.scores)} 条评分")

if __name__ == "__main__":
    import argparse
    parser = argparse.ArgumentParser()
    parser.add_argument("--results", default="results/results.json")
    args = parser.parse_args()
    ScorerGUI(args.results)
```

